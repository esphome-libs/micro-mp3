---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual "Run workflow" from the Actions tab.
  workflow_dispatch:

# Least privilege: every job here only reads the repo (checkout, build, test, cache). Jobs that
# need more should add a narrower job-level permissions block rather than widening this default.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - uses: esphome/pre-commit-action@43cd1109c09c544d97196f7730ee5b2e0cc6d81e # v3.0.1 fork with pinned actions/cache

  lint:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18

      - name: Run clang-tidy
        run: ./script/clang-tidy.sh

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: ./script/cppcheck.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure CMake
        run: cmake -B build -DENABLE_SANITIZERS=ON -DENABLE_WERROR=ON host_examples/mp3_to_wav

      - name: Build
        run: cmake --build build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure CMake
        run: cmake -B tests/build -DENABLE_SANITIZERS=ON -DENABLE_WERROR=ON tests

      - name: Build tests
        run: cmake --build tests/build

      - name: Run tests
        run: ctest --test-dir tests/build --output-on-failure

  conformance:
    name: ISO conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Single source of truth for the pinned vector commit: read it from the
      # script so the cache key cannot drift from what the script checks out.
      - name: Resolve pinned vector commit
        run: |
          # Anchor to the MINIMP3_REF assignment so an unrelated 40-hex string
          # elsewhere in the script can never hijack the cache key.
          ref="$(grep -oE 'MINIMP3_REF:-[0-9a-f]{40}' tests/conformance/run_conformance.sh | head -1)"
          ref="${ref#MINIMP3_REF:-}"
          echo "MINIMP3_REF=${ref}" >> "$GITHUB_ENV"

      # Cache the external minimp3 ISO vectors (~3 MB), keyed on the pinned
      # commit so a ref bump invalidates it. On a hit, run_conformance.sh sees
      # the vectors present and skips the clone entirely.
      - name: Cache conformance vectors
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/conformance/vectors
          key: conformance-vectors-${{ env.MINIMP3_REF }}

      # Builds the harness and decodes every gated Layer III vector against its
      # ISO reference (full-accuracy PSNR + peak-difference gate).
      - name: Build and run conformance gate
        run: ./tests/conformance/run_conformance.sh

  fuzz:
    name: Fuzz build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      # Standalone harness (no libFuzzer runtime needed) under ASan/UBSan.
      # Guards against harness compile/link regressions and runs the
      # parameterless torture battery; deep corpus fuzzing stays a local task
      # (see tests/fuzz). -fno-sanitize-recover=all in the build makes any
      # sanitizer finding abort the run.
      - name: Configure fuzz harness (standalone)
        run: cmake -B tests/fuzz/build-standalone -DFUZZ_USE_LIBFUZZER=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ tests/fuzz

      - name: Build fuzz harness
        run: cmake --build tests/fuzz/build-standalone

      - name: Run standalone torture battery
        env:
          FUZZ_ITERATIONS: '500'
          ASAN_OPTIONS: abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ./tests/fuzz/build-standalone/fuzz_mp3_decode

  platformio:
    name: PlatformIO Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            examples/decode_benchmark/.pio
          key: pio-decode_benchmark-${{ hashFiles('examples/decode_benchmark/platformio.ini') }}
          restore-keys: |
            pio-decode_benchmark-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build decode_benchmark
        run: pio run -d examples/decode_benchmark

  # Single aggregating status for branch protection: require only "CI success" instead of every job.
  # always() so it reports even when a job fails; skipped dependencies are treated as passing (only
  # failure/cancelled blocks).
  ci-success:
    name: CI success
    if: always()
    needs:
      - pre-commit
      - lint
      - cppcheck
      - build
      - test
      - conformance
      - fuzz
      - platformio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more CI jobs failed or were cancelled:"
          echo '${{ toJSON(needs) }}'
          exit 1

      - name: Report success
        run: echo "All required CI jobs passed (skipped jobs are allowed)."
